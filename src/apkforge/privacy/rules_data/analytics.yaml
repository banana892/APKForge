rules:
  - id: analytics.google.firebase
    name: Google Analytics for Firebase
    vendor: Google
    category: analytics
    description: Firebase Analytics event logging and user engagement tracking.
    source_reference: Firebase Analytics Android SDK Documentation
    evidence_requirements: Package com.google.firebase.analytics or FirebaseAnalytics class
    false_positive_risk: Low; specific to Google Firebase Analytics components
    packages:
      - com.google.android.gms.measurement
      - com.google.firebase.analytics
    classes:
      - com.google.firebase.analytics.FirebaseAnalytics
      - com.google.android.gms.measurement.AppMeasurement
    strings:
      - "google_app_id"
      - "google_api_key"
      - "firebase_analytics"
    domains:
      - app-measurement.com
      - firebaseinstallations.googleapis.com
      - firebaselogging-pa.googleapis.com

  - id: analytics.flurry
    name: Flurry Analytics
    vendor: Yahoo
    category: analytics
    description: Flurry mobile analytics and app performance monitoring.
    source_reference: Flurry Developer Portal
    evidence_requirements: Package com.flurry.android or FlurryAgent class
    false_positive_risk: Low; proprietary Flurry namespaces
    packages:
      - com.flurry.android
    classes:
      - com.flurry.android.FlurryAgent
    strings:
      - "FlurryAgent"
    domains:
      - data.flurry.com
      - flurry.com

  - id: analytics.mixpanel
    name: Mixpanel
    vendor: Mixpanel
    category: analytics
    description: Mixpanel product analytics and event tracking.
    source_reference: Mixpanel Android SDK Documentation
    evidence_requirements: Package com.mixpanel.android or MixpanelAPI class
    false_positive_risk: Low; proprietary Mixpanel namespaces
    packages:
      - com.mixpanel.android.mpmetrics
    classes:
      - com.mixpanel.android.mpmetrics.MixpanelAPI
    strings:
      - "com.mixpanel.android.MPConfig"
    domains:
      - api.mixpanel.com
      - mixpanel.com

  - id: analytics.amplitude
    name: Amplitude
    vendor: Amplitude
    category: analytics
    description: Amplitude product intelligence and behavioral analytics.
    source_reference: Amplitude Android SDK Documentation
    evidence_requirements: Package com.amplitude.api or AmplitudeClient class
    false_positive_risk: Low; proprietary Amplitude namespaces
    packages:
      - com.amplitude.api
    classes:
      - com.amplitude.api.Amplitude
      - com.amplitude.api.AmplitudeClient
    strings:
      - "AmplitudeClient"
    domains:
      - api.amplitude.com
      - api2.amplitude.com

  - id: analytics.segment
    name: Segment / Twilio Segment
    vendor: Twilio
    category: analytics
    description: Segment customer data platform and routing library.
    source_reference: Twilio Segment Developer Documentation
    evidence_requirements: Package com.segment.analytics or Analytics class in com.segment
    false_positive_risk: Low; distinct com.segment namespace
    packages:
      - com.segment.analytics
    classes:
      - com.segment.analytics.Analytics
    strings:
      - "com.segment.analytics"
    domains:
      - api.segment.io
      - cdn.segment.com

  - id: analytics.clevertap
    name: CleverTap
    vendor: CleverTap
    category: analytics
    description: CleverTap customer engagement and behavioral tracking platform.
    source_reference: CleverTap Android SDK Documentation
    evidence_requirements: Package com.clevertap.android.sdk or CleverTapAPI class
    false_positive_risk: Low; proprietary CleverTap namespaces
    packages:
      - com.clevertap.android.sdk
    classes:
      - com.clevertap.android.sdk.CleverTapAPI
    strings:
      - "CLEVERTAP_ACCOUNT_ID"
    domains:
      - clevertap.com
      - wizrocket.com
