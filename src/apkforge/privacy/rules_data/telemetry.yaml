rules:
  - id: telemetry.sentry
    name: Sentry
    vendor: Sentry
    category: crash_reporting
    description: Open-source error tracking and performance monitoring.
    source_reference: Sentry Android SDK Documentation
    evidence_requirements: Package io.sentry or Sentry class
    false_positive_risk: Low; distinct io.sentry namespace
    packages:
      - io.sentry
      - io.sentry.android
    classes:
      - io.sentry.Sentry
      - io.sentry.android.core.SentryAndroid
    strings:
      - "io.sentry.dsn"
    domains:
      - sentry.io
      - ingest.sentry.io

  - id: telemetry.firebase.crashlytics
    name: Firebase Crashlytics
    vendor: Google
    category: crash_reporting
    description: Real-time crash reporting and diagnostic issue logging.
    source_reference: Firebase Crashlytics Android SDK Documentation
    evidence_requirements: Package com.google.firebase.crashlytics or FirebaseCrashlytics class
    false_positive_risk: Low; specific to Google Firebase Crashlytics
    packages:
      - com.google.firebase.crashlytics
    classes:
      - com.google.firebase.crashlytics.FirebaseCrashlytics
    strings:
      - "com.crashlytics.android.build_id"
    domains:
      - crashlyticsreports-pa.googleapis.com
      - crashlytics.com

  - id: telemetry.bugsnag
    name: Bugsnag
    vendor: SmartBear
    category: crash_reporting
    description: Full-stack application stability and error monitoring.
    source_reference: Bugsnag Android SDK Documentation
    evidence_requirements: Package com.bugsnag.android or Bugsnag class
    false_positive_risk: Low; distinct com.bugsnag namespace
    packages:
      - com.bugsnag.android
    classes:
      - com.bugsnag.android.Bugsnag
    strings:
      - "com.bugsnag.android.API_KEY"
    domains:
      - notify.bugsnag.com
      - bugsnag.com

  - id: telemetry.microsoft.appcenter
    name: Microsoft Visual Studio App Center
    vendor: Microsoft
    category: telemetry
    description: Microsoft diagnostics, crash reporting, and analytics service.
    source_reference: Microsoft App Center Android SDK Documentation
    evidence_requirements: Package com.microsoft.appcenter or AppCenter class
    false_positive_risk: Low; distinct Microsoft AppCenter namespace
    packages:
      - com.microsoft.appcenter
      - com.microsoft.appcenter.crashes
      - com.microsoft.appcenter.analytics
    classes:
      - com.microsoft.appcenter.AppCenter
    strings:
      - "appcenter.ms"
    domains:
      - in.appcenter.ms
      - appcenter.ms
